[build-system]
# Pinned: uv.lock does not lock build dependencies, so a deploy-time wheel build would
# otherwise resolve whatever setuptools is newest. Move it with a `uv lock` refresh.
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-metadata-mcp"
version = "0.4.0"
description = "Read-only MCP server exposing SQLite metadata index for ~/.claude/memory/ notes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # Capped below 4: 4.x is a major this server has never run on. uv.lock pins what is
    # tested and deployed; the CI `latest` job resolves the newest versions these ranges
    # allow, so a forward-compat break shows up there rather than at the next deploy.
    # fastmcp 3.4.10 is a security floor.
    "fastmcp>=3.4.10,<4",
    "structlog>=24.0",
    # Security floors on transitive deps. None is imported here directly; each is declared
    # only to hold its floor. uv.lock is the control: it pins every package, and a deploy
    # builds a fresh venv from it. These floors are the second line, for an install that
    # re-resolves into an existing venv (`pip install .`) and would otherwise keep an old
    # version it finds there.
    #
    # Scope, checked 2026-10-26 against every published advisory for every package in the
    # locked runtime set: each package a request reaches whose declared range still admitted
    # an advisory has a floor at or above its newest fix. That is the streamable-HTTP
    # transport (h11, starlette, anyio, mcp, python-multipart), opentelemetry-api (fastmcp
    # parses each tool call's trace context with it), and pyjwt, which mcp pulls in for its
    # auth layer. uvicorn needs no floor: no advisory falls in its range. The server
    # configures no auth provider and makes no outbound HTTP. Packages off the request path
    # whose ranges still admit an advisory are held only by the lock: authlib, certifi,
    # cryptography, dnspython, idna, jaraco-context, joserfc, pydantic-settings, pygments,
    # python-dotenv.
    "starlette>=1.3.1",
    # Capped below 2 with fastmcp's own range.
    "mcp>=1.30,<2",
    "python-multipart>=0.0.31",
    "pyjwt>=2.15.0",
    "anyio>=4.14.2",
    # uvicorn's HTTP/1.1 parser.
    "h11>=0.16.0",
    # fastmcp extracts the caller's traceparent/tracestate from every tool call's _meta.
    "opentelemetry-api>=1.45.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[project.scripts]
memory-metadata-mcp = "memory_metadata_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
source = ["memory_metadata_mcp"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
