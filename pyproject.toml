[project]
name = "memory-metadata-mcp"
version = "0.2.0"
description = "Read-only MCP server exposing SQLite metadata index for ~/.claude/memory/ notes"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.2.4,<4",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
